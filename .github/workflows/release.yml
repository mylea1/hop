name: Build and release Hop

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            arch: arm64
            target: dmg
            asset: Hop-mac-arm64.dmg
            certificate: MAC_CSC_LINK
            password: MAC_CSC_KEY_PASSWORD
          - runner: macos-15-intel
            platform: mac
            arch: x64
            target: dmg
            asset: Hop-mac-x64.dmg
            certificate: MAC_CSC_LINK
            password: MAC_CSC_KEY_PASSWORD
          - runner: windows-2022
            platform: win
            arch: x64
            target: nsis
            asset: Hop-windows-x64.exe
            certificate: WIN_CSC_LINK
            password: WIN_CSC_KEY_PASSWORD
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify tag matches package version
        run: node -e "if(process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) throw new Error('Tag must be v' + require('./package.json').version)"
      - run: npm ci
      - run: npm test
      - run: npm run icons
      - name: Package on native hardware
        run: npx electron-builder --${{ matrix.platform }} ${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          CSC_LINK: ${{ secrets[matrix.certificate] }}
          CSC_KEY_PASSWORD: ${{ secrets[matrix.password] }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish all three installers together
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify complete asset set and compute checksums
        working-directory: release-assets
        run: |
          test -s Hop-mac-arm64.dmg
          test -s Hop-mac-x64.dmg
          test -s Hop-windows-x64.exe
          sha256sum Hop-mac-arm64.dmg Hop-mac-x64.dmg Hop-windows-x64.exe > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "Hop $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
          fi
